[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "read-the-room"
version = "0.1.0"
description = "Group chat manners for AI agents (built for Hermes Agent on iMessage): know when you are addressed, stay silent otherwise, work with other agents without loops."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
